backend:
  name: github
  repo: flavioluiz/iea_site_dev
  branch: main
  base_url: https://iea-decap-oauth.flavioluiz.workers.dev
  auth_endpoint: /auth
  site_domain: flavioluiz.github.io
  open_authoring: true
  squash_merges: true

publish_mode: editorial_workflow
locale: pt
site_url: https://flavioluiz.github.io/iea_site/
display_url: https://flavioluiz.github.io/iea_site/
logo_url: ../images/ita_logo.png
show_preview_links: true
search: true

media_folder: static/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: paginas
    label: "1. Mapa do site"
    label_singular: "Item técnico do menu"
    description: "Esta coleção abre o Mapa visual automaticamente. A lista técnica serve apenas para ajustar nome, posição e visibilidade no menu; o texto da página possui um botão próprio no mapa."
    folder: data/paginas
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: id
    slug: "{{fields.id}}"
    summary: "{{rotulo.pt}} — dentro de: {{parent}}"
    sortable_fields: [ordem, rotulo.pt, tipo, id]
    view_filters:
      - { label: "📄 Páginas comuns — texto editável aqui", field: tipo, pattern: "^pagina_editavel$" }
      - { label: "📄 Páginas existentes — conteúdo em outro editor", field: tipo, pattern: "^pagina_estrutural$" }
      - { label: "📁 Seções que abrem um submenu", field: tipo, pattern: "^grupo$" }
      - { label: "Visíveis em português", field: visivel.pt, pattern: true }
      - { label: "Fora do menu em português", field: visivel.pt, pattern: false }
    view_groups:
      - { label: "Onde fica no menu", field: parent }
      - { label: "O que o item representa", field: tipo }
    editor:
      preview: true
    fields:
      - label: "Função técnica deste item no menu"
        name: tipo
        widget: select
        default: pagina_editavel
        options:
          - { label: "📄 Página comum — título e texto editáveis aqui", value: pagina_editavel }
          - { label: "📁 Seção do menu — abre uma lista de páginas", value: grupo }
          - { label: "📄 Página existente — conteúdo em outro editor", value: pagina_estrutural }
          - { label: "🔗 Link externo — abre outro site", value: link_externo }
          - { label: "🏷️ Título de categoria — apenas organiza o submenu", value: categoria }
          - { label: "— Separador — apenas espaço visual", value: separador }
          - { label: "⚙️ Raiz técnica — não usar", value: raiz }
        hint: "Ao criar uma página, escolha Página comum. Em item existente, não troque esta função; volte ao Mapa visual para editar o conteúdo no lugar correto."
      - { label: "Item protegido", name: protegido, widget: hidden, default: false }
      - label: "Onde este item fica?"
        name: parent
        widget: relation
        collection: paginas
        value_field: id
        search_fields: [rotulo.pt, rotulo.en, id]
        display_fields: [rotulo.pt, rotulo.en]
        options_length: 100
        filters:
          - field: tipo
            values: [raiz, grupo]
        default: root
        required: false
        hint: "Menu principal cria um bloco na barra superior. Escolher A Divisão, Pesquisa etc. coloca o item recuado dentro daquela seção."
      - { label: "Posição dentro dessa seção", name: ordem, widget: number, value_type: int, min: 0, max: 10000, default: 100, hint: "Números menores aparecem antes. Exemplo: 10, 20, 30." }
      - label: "Mostrar no menu"
        name: visivel
        widget: object
        collapsed: false
        fields:
          - { label: "Português", name: pt, widget: boolean, default: true }
          - { label: "English", name: en, widget: boolean, default: true }
      - label: "Nome exibido no menu"
        name: rotulo
        widget: object
        collapsed: false
        fields:
          - { label: "Português", name: pt, widget: string, required: false }
          - { label: "English", name: en, widget: string, required: false }
      - label: "Endereço de página automática ou link — avançado"
        name: url
        widget: object
        collapsed: true
        hint: "Use apenas para página automática ou link externo. Em Página editável, deixe vazio: o endereço abaixo será usado automaticamente."
        fields:
          - { label: "Português", name: pt, widget: string, required: false }
          - { label: "English", name: en, widget: string, required: false }
      - label: "📄 Título e texto da página comum"
        name: pagina
        widget: object
        collapsed: true
        hint: "Abra somente em itens marcados como 📄 Página comum. Para uma página 🧩 automática, use Páginas especiais."
        fields:
          - label: "Endereço permanente"
            name: slug
            widget: string
            required: false
            pattern: ["^$|^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas, números e hífens."]
            hint: "Exemplo: historia-da-divisao cria /historia-da-divisao/. Não altere após publicar sem orientação do mantenedor."
          - { label: "Página publicada", name: publicada, widget: boolean, default: true, hint: "Desligue para retirar a página do site sem apagar o conteúdo." }
          - label: "Título da página"
            name: titulo
            widget: object
            collapsed: false
            fields:
              - { label: "Português", name: pt, widget: string, required: false }
              - { label: "English", name: en, widget: string, required: false }
          - label: "Resumo para buscadores"
            name: descricao
            widget: object
            collapsed: true
            fields:
              - { label: "Português", name: pt, widget: text, required: false }
              - { label: "English", name: en, widget: text, required: false }
          - label: "Texto da página"
            name: conteudo
            widget: object
            collapsed: false
            fields:
              - { label: "Português", name: pt, widget: markdown, required: false }
              - { label: "English", name: en, widget: markdown, required: false }
      - label: "Código interno — avançado"
        name: id
        widget: string
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas, números e hífens."]
        hint: "Preencha ao criar e não altere depois. Exemplo: historia-da-divisao. Este código mantém os vínculos do menu."

  - name: paginas_estruturais
    label: "2. Textos em Markdown"
    description: "Edite aqui páginas Markdown completas e introduções de páginas que também exibem dados. O Mapa visual identifica claramente cada caso e abre diretamente o formulário correto."
    editor:
      preview: true
    files:
      - label: "Graduação — Português — Markdown completo"
        name: graduacao_pt
        file: content/graduacao/_index.pt.md
        fields: &markdown_page_fields
          - { label: "Título", name: title, widget: string }
          - { label: "Resumo para buscadores", name: description, widget: text }
          - { label: "Conteúdo completo da página", name: body, widget: markdown, hint: "Todo o conteúdo principal desta página está neste campo Markdown." }
      - { label: "Undergraduate — English — full Markdown", name: graduacao_en, file: content/graduacao/_index.en.md, fields: *markdown_page_fields }
      - { label: "Pós-Graduação — Português — Markdown completo", name: posgraduacao_pt, file: content/posgraduacao/_index.pt.md, fields: *markdown_page_fields }
      - { label: "Graduate Studies — English — full Markdown", name: posgraduacao_en, file: content/posgraduacao/_index.en.md, fields: *markdown_page_fields }

      - label: "Disciplinas — Português — Markdown + páginas filhas"
        name: disciplinas_pt
        file: content/disciplinas/_index.md
        fields: &hybrid_page_fields
          - { label: "Título", name: title, widget: string }
          - { label: "Resumo para buscadores", name: description, widget: text }
          - { label: "Tipo interno", name: type, widget: hidden, required: false }
          - { label: "Layout interno", name: layout, widget: hidden, required: false }
          - { label: "Ano interno", name: year, widget: hidden, required: false }
          - { label: "Texto em Markdown", name: body, widget: markdown, required: false, hint: "Este texto aparece antes das fichas, listas ou dados montados automaticamente." }
      - { label: "Courses — English — Markdown + child pages", name: disciplinas_en, file: content/disciplinas/_index.en.md, fields: *hybrid_page_fields }

      - { label: "Departamentos — introdução em Markdown", name: departamentos_pt, file: content/departamentos/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Departments — Markdown introduction", name: departamentos_en, file: content/departamentos/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Linhas de pesquisa — introdução em Markdown", name: linhas_pt, file: content/linhas/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Research lines — Markdown introduction", name: linhas_en, file: content/linhas/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Área Espacial — texto em Markdown + dados", name: espaco_pt, file: content/espaco/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Space Program — Markdown + data", name: espaco_en, file: content/espaco/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Documentos e horários — introdução em Markdown", name: documentos_pt, file: content/documentos/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Documents and schedules — Markdown introduction", name: documentos_en, file: content/documentos/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Pessoas — introdução em Markdown", name: pessoal_pt, file: content/pessoal/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "People — Markdown introduction", name: pessoal_en, file: content/pessoal/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Laboratórios — introdução em Markdown", name: laboratorios_pt, file: content/laboratorios/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Laboratories — Markdown introduction", name: laboratorios_en, file: content/laboratorios/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Projetos — introdução em Markdown", name: projetos_pt, file: content/projetos/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Projects — Markdown introduction", name: projetos_en, file: content/projetos/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Publicações — introdução em Markdown", name: publicacoes_pt, file: content/publicacoes/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Publications — Markdown introduction", name: publicacoes_en, file: content/publicacoes/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Dissertações e teses — introdução em Markdown", name: teses_pt, file: content/teses/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Dissertations and theses — Markdown introduction", name: teses_en, file: content/teses/_index.en.md, fields: *hybrid_page_fields }
      - { label: "Trabalhos de Graduação — introdução em Markdown", name: tgs_pt, file: content/tgs/_index.pt.md, fields: *hybrid_page_fields }
      - { label: "Undergraduate theses — Markdown introduction", name: tgs_en, file: content/tgs/_index.en.md, fields: *hybrid_page_fields }

      - label: "Início — Português — template especial + Markdown"
        name: inicio_pt
        file: content/_index.pt.md
        fields: &home_page_fields
          - { label: "Título principal", name: title, widget: string, hint: "Aparece no destaque da Home. O restante da composição visual usa um template especial." }
          - { label: "Texto de destaque", name: description, widget: text, hint: "Aparece abaixo do título e resume a página para buscadores." }
          - { label: "Texto Markdown abaixo dos destaques", name: body, widget: markdown, hint: "Este campo não cria nem reorganiza os cartões do template." }
      - { label: "Home — English — special template + Markdown", name: inicio_en, file: content/_index.en.md, fields: *home_page_fields }

  - name: pessoal
    label: "3. Pessoas e professores"
    label_singular: "Pessoa"
    description: "Uma ficha por pessoa. Use Filtrar por ou Agrupar por; em Visualizar como, escolha cartões para ver as fotos. Desative em vez de excluir quem saiu."
    folder: data/pessoal/professores
    create: true
    format: json
    extension: json
    identifier_field: nome
    slug: "{{fields.id}}"
    summary: "{{nome}} — {{departamento}} — {{categoria}}"
    sortable_fields: [nome, departamento, categoria, ativo]
    view_filters:
      - { label: "Somente pessoas ativas", field: ativo, pattern: true }
      - { label: "Somente pessoas inativas", field: ativo, pattern: false }
      - { label: "Departamento IEA-A", field: departamento, pattern: "^iea-a$" }
      - { label: "Departamento IEA-B", field: departamento, pattern: "^iea-b$" }
      - { label: "Departamento IEA-C", field: departamento, pattern: "^iea-c$" }
      - { label: "Departamento IEA-E", field: departamento, pattern: "^iea-e$" }
      - { label: "Departamento IEA-P", field: departamento, pattern: "^iea-p$" }
      - { label: "Departamento IEA-S", field: departamento, pattern: "^iea-s$" }
      - { label: "Professor titular", field: categoria, pattern: "^Professor Titular$" }
      - { label: "Professor associado", field: categoria, pattern: "^Professor Associado$" }
      - { label: "Professor adjunto", field: categoria, pattern: "^Professor Adjunto$" }
      - { label: "Tecnologista", field: categoria, pattern: "^Tecnologista$" }
      - { label: "Analista em C&T", field: categoria, pattern: "^Analista em Ciência e Tecnologia$" }
      - { label: "Instrutor", field: categoria, pattern: "^Instrutor$" }
      - { label: "Docente voluntário", field: categoria, pattern: "^Docente Voluntário$" }
    view_groups:
      - { label: "Departamento", field: departamento }
      - { label: "Categoria", field: categoria }
    fields:
              - label: "Identificador técnico"
                name: id
                widget: string
                pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use apenas minúsculas, números e hífens, por exemplo nome-sobrenome."]
                hint: "Não altere em uma pessoa existente: este código mantém os links estáveis."
              - { label: "Nome completo", name: nome, widget: string, hint: "Confira a grafia em fonte institucional." }
              - { label: "Nome curto", name: nome_destaque, widget: string, required: false, hint: "Opcional; como a pessoa deve ser chamada em espaços compactos." }
              - { label: "Ativo no site", name: ativo, widget: boolean, default: true, hint: "Desligue para ocultar a pessoa sem perder histórico." }
              - label: "Departamento"
                name: departamento
                widget: select
                options:
                  - { label: "Sem departamento (somente inativo)", value: "" }
                  - { label: "IEA-A — Aerodinâmica", value: iea-a }
                  - { label: "IEA-B — Mecânica do Voo", value: iea-b }
                  - { label: "IEA-C — Propulsão", value: iea-c }
                  - { label: "IEA-E — Estruturas", value: iea-e }
                  - { label: "IEA-P — Projetos", value: iea-p }
                  - { label: "IEA-S — Sistemas Aeroespaciais", value: iea-s }
              - label: "Categoria"
                name: categoria
                widget: select
                options: ["", "Professor Titular", "Professor Associado", "Professor Adjunto", "Tecnologista", "Analista em Ciência e Tecnologia", "Instrutor", "Docente Voluntário"]
              - { label: "Posto", name: posto, widget: string, required: false, hint: "Somente quando aplicável, por exemplo Maj Eng AER." }
              - { label: "Cargos na Divisão", name: cargos, widget: list, required: false, field: { label: "Cargo", name: cargo, widget: string } }
              - { label: "Chefe do departamento", name: chefe_departamento, widget: boolean, default: false }
              - label: "Foto"
                name: foto
                widget: image
                required: false
                choose_url: false
                media_folder: /static/images/pessoal
                public_folder: images/pessoal
                allow_multiple: false
                hint: "JPEG, PNG ou WebP; retrato nítido, entre 80 e 4096 px e no máximo 2 MB. O nome do arquivo deve ser simples."
                media_library:
                  config:
                    multiple: false
                    max_file_size: 2097152
              - { label: "E-mail público", name: email, widget: string, required: false, hint: "Preencha somente com autorização para publicação." }
              - label: "Links acadêmicos"
                name: links
                widget: object
                collapsed: true
                hint: "Cole a URL completa, começando com https:// (ou http:// para links legados)."
                fields:
                  - { label: "Currículo Lattes", name: lattes, widget: string, required: false }
                  - { label: "Scopus", name: scopus, widget: string, required: false }
                  - { label: "ORCID", name: orcid, widget: string, required: false }
                  - { label: "Google Scholar", name: google_scholar, widget: string, required: false }
                  - { label: "ResearchGate", name: researchgate, widget: string, required: false }
                  - { label: "Web of Science", name: web_of_science, widget: string, required: false }
                  - { label: "Site pessoal", name: site, widget: string, required: false }
              - label: "IDs de autor Scopus — avançado"
                name: scopus_author_ids
                widget: list
                required: false
                collapsed: true
                hint: "Controla a atualização automática de publicações e métricas; não aparece como texto no perfil. Somente números. Não copie o ID de outra pessoa."
                field: { label: "ID", name: id, widget: string, pattern: ["^[0-9]+$", "O ID Scopus contém somente números."] }
              - label: "Linhas de pesquisa"
                name: linhas_pesquisa
                widget: object
                collapsed: true
                fields:
                  - { label: "Português", name: pt, widget: list, required: false, field: { label: "Linha", name: linha, widget: string } }
                  - { label: "English", name: en, widget: list, required: false, field: { label: "Research line", name: line, widget: string } }
              - label: "Resumo profissional"
                name: resumo
                widget: object
                collapsed: true
                fields:
                  - { label: "Português", name: pt, widget: text, required: false }
                  - { label: "English", name: en, widget: text, required: false }
              - label: "Formação acadêmica"
                name: formacao_academica
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.tipo}} — {{fields.instituicao}}"
                fields:
                  - { label: "Tipo", name: tipo, widget: string }
                  - { label: "Período", name: periodo, widget: string, required: false }
                  - { label: "Instituição", name: instituicao, widget: string, required: false }
                  - { label: "Título/trabalho", name: titulo, widget: text, required: false }
                  - { label: "Ano de obtenção", name: ano_obtencao, widget: number, value_type: int, required: false }
              - label: "Prêmios e títulos"
                name: premios_titulos
                widget: list
                required: false
                collapsed: true
                fields:
                  - { label: "Ano", name: ano, widget: number, value_type: int, required: false }
                  - { label: "Descrição", name: titulo, widget: string }
              - label: "Idiomas"
                name: idiomas
                widget: list
                required: false
                collapsed: true
                fields:
                  - { label: "Idioma", name: idioma, widget: string }
                  - { label: "Proficiência", name: proficiencia, widget: string }
              - { label: "Bolsa CNPq", name: bolsista_cnpq, widget: string, required: false }
              - { label: "Fonte usada para conferir — controle interno", name: fonte, widget: string, hint: "Não aparece no site. Informe uma página ou documento institucional verificável para a revisão." }
              - label: "Data da conferência"
                name: verificado_em
                widget: datetime
                date_format: "DD/MM/YYYY"
                time_format: false
                format: "YYYY-MM-DD"
                hint: "Controle interno da revisão; não aparece no site."

  - name: laboratorios
    label: "4. Laboratórios"
    label_singular: "Laboratório"
    description: "Uma ficha por laboratório. Edite somente o laboratório desejado: os demais permanecem intactos. Use os filtros para localizar por departamento ou tema."
    folder: data/laboratorios
    create: true
    format: json
    extension: json
    identifier_field: nome_pt
    slug: "{{fields.id}}"
    summary: "{{sigla}} — {{nome_pt}} — {{departamento}}"
    sortable_fields: [nome_pt, sigla, departamento, tema]
    view_filters:
      - { label: "Departamento IEA-A", field: departamento, pattern: "^iea-a$" }
      - { label: "Departamento IEA-B", field: departamento, pattern: "^iea-b$" }
      - { label: "Departamento IEA-C", field: departamento, pattern: "^iea-c$" }
      - { label: "Departamento IEA-E", field: departamento, pattern: "^iea-e$" }
      - { label: "Departamento IEA-P", field: departamento, pattern: "^iea-p$" }
      - { label: "Departamento IEA-S", field: departamento, pattern: "^iea-s$" }
      - { label: "Tema aeronáutico", field: tema, pattern: "^aeronautica$" }
      - { label: "Tema espacial", field: tema, pattern: "^espacial$" }
      - { label: "Ambos os temas", field: tema, pattern: "^ambos$" }
    view_groups:
      - { label: "Departamento", field: departamento }
      - { label: "Tema", field: tema }
    fields:
      - { label: "Identificador técnico", name: id, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas e hífens."], hint: "Não altere em um laboratório existente." }
      - { label: "Sigla", name: sigla, widget: string }
      - { label: "Nome em português", name: nome_pt, widget: string }
      - { label: "Name in English", name: nome_en, widget: string }
      - { label: "Departamento", name: departamento, widget: select, required: false, options: ["", iea-a, iea-b, iea-c, iea-e, iea-p, iea-s] }
      - { label: "Tema", name: tema, widget: select, options: [aeronautica, espacial, ambos] }
      - { label: "Descrição em português", name: descricao_pt, widget: text }
      - { label: "Description in English", name: descricao_en, widget: text }
      - { label: "Infraestrutura em português", name: infraestrutura, widget: list, required: false, field: { label: "Item", name: item, widget: string } }
      - { label: "Infrastructure in English", name: infraestrutura_en, widget: list, required: false, field: { label: "Item", name: item, widget: string } }
      - { label: "Projetos associados", name: projetos_associados, widget: list, required: false, field: { label: "Projeto", name: projeto, widget: string } }
      - { label: "Responsáveis", name: responsaveis, widget: list, required: false, hint: "Informe nomes públicos e conferidos.", field: { label: "Nome", name: responsavel, widget: string } }
      - label: "Foto do laboratório"
        name: imagens
        widget: list
        required: false
        max: 1
        collapsed: true
        hint: "Foto de capa: JPEG, PNG ou WebP; 80–4096 px e no máximo 2 MB."
        field:
          label: "Foto"
          name: imagem
          widget: image
          choose_url: false
          media_folder: /static/images/laboratorios
          public_folder: images/laboratorios
          allow_multiple: false
          media_library:
            config:
              multiple: false
              max_file_size: 2097152
      - { label: "URL PNIPE", name: pnipe_url, widget: string, required: false }
      - { label: "Site do laboratório", name: website_url, widget: string, required: false }
      - { label: "Cor", name: cor, widget: color, required: false, allowInput: true }
      - { label: "Tags", name: tags, widget: list, required: false, field: { label: "Tag", name: tag, widget: string } }

  - name: estrutura
    label: "5. Estrutura e pesquisa"
    description: "Departamentos, projetos e linhas de pesquisa. Os campos PT e EN aparecem no mesmo formulário."
    format: json
    files:
      - label: "Departamentos"
        name: departamentos
        file: data/departamentos.json
        fields:
          - { label: "Versão", name: schema_version, widget: hidden, default: 1 }
          - label: "Departamentos"
            name: departamentos
            widget: list
            collapsed: true
            summary: "{{fields.sigla}} — {{fields.nome_pt}}"
            fields:
              - { label: "ID", name: id, widget: string, hint: "Não altere em um departamento existente." }
              - { label: "Sigla", name: sigla, widget: string }
              - { label: "Nome em português", name: nome_pt, widget: string }
              - { label: "Name in English", name: nome_en, widget: string }
              - { label: "Descrição em português", name: descricao_pt, widget: text }
              - { label: "Description in English", name: descricao_en, widget: text }
              - { label: "Chefe", name: chefe, widget: string, required: false }
              - { label: "E-mail", name: email, widget: string, required: false }
              - { label: "Cor", name: cor, widget: color, allowInput: true }
              - { label: "Temas", name: temas, widget: select, multiple: true, options: [aeronautica, espacial] }
      - label: "Projetos"
        name: projetos
        file: data/projetos.json
        fields:
          - { label: "Versão", name: schema_version, widget: hidden, default: 1 }
          - label: "Projetos"
            label_singular: "Projeto"
            name: projetos
            widget: list
            collapsed: true
            summary: "{{fields.titulo_pt}} — {{fields.status}}"
            fields:
              - { label: "ID", name: id, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas e hífens."] }
              - { label: "Título em português", name: titulo_pt, widget: string }
              - { label: "Title in English", name: titulo_en, widget: string, required: false }
              - { label: "Departamento", name: departamento, widget: select, required: false, options: ["", iea-a, iea-b, iea-c, iea-e, iea-p, iea-s] }
              - { label: "Financiador", name: financiador, widget: string, required: false }
              - { label: "Valor em reais", name: valor, widget: number, value_type: float, min: 0, required: false, hint: "Digite somente o número, sem R$ nem pontos de milhar. Deixe vazio quando não for público." }
              - { label: "Período", name: periodo, widget: string, required: false }
              - { label: "Status", name: status, widget: select, options: [em_andamento, concluido, suspenso], hint: "Somente projetos 'em_andamento' aparecem na página de projetos ativos." }
              - { label: "Tema", name: tema, widget: select, required: false, options: ["", aeronautica, espacial, ambos] }
              - { label: "Pessoas da IEA", name: docentes_iea, widget: list, required: false, field: { label: "Nome", name: nome, widget: string } }
              - { label: "Demais participantes", name: docentes, widget: list, required: false, field: { label: "Nome", name: nome, widget: string } }
              - { label: "Descrição em português", name: descricao_pt, widget: text, required: false }
              - { label: "Description in English", name: descricao_en, widget: text, required: false }
      - label: "Linhas de pesquisa"
        name: linhas
        file: data/linhas_pesquisa.json
        fields:
          - { label: "Versão", name: schema_version, widget: hidden, default: 1 }
          - label: "Linhas"
            label_singular: "Linha de pesquisa"
            name: linhas
            widget: list
            collapsed: true
            summary: "{{fields.nome_pt}}"
            fields:
              - { label: "ID", name: id, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas e hífens."] }
              - { label: "Nome em português", name: nome_pt, widget: string }
              - { label: "Name in English", name: nome_en, widget: string }
              - { label: "Tema", name: tema, widget: select, options: [aeronautica, espacial, ambos] }
              - { label: "Cor", name: cor, widget: color, allowInput: true }
              - { label: "Descrição em português", name: descricao_pt, widget: text }
              - { label: "Description in English", name: descricao_en, widget: text }
              - { label: "Palavras-chave — avançado", name: keywords, widget: list, required: false, hint: "Usadas para classificar automaticamente publicações; não aparecem como texto nesta página.", field: { label: "Palavra-chave", name: keyword, widget: string } }
              - { label: "Áreas Scopus — avançado", name: subject_areas, widget: list, required: false, hint: "Usadas para classificar automaticamente publicações; não aparecem como texto nesta página.", field: { label: "Área", name: area, widget: string } }

  - name: documentos
    label: "6. Documentos, horários e salas"
    description: "Publique PDFs de horários, salas, regulamentos e comunicados. A categoria 'Horários de aulas e salas' já está pronta."
    format: json
    files:
      - label: "PDFs e documentos"
        name: catalogo_documentos
        file: data/documentos.json
        fields:
          - { label: "Versão", name: schema_version, widget: hidden, default: 1 }
          - label: "Categorias"
            name: categorias
            widget: list
            collapsed: true
            summary: "{{fields.nome_pt}}"
            fields:
              - { label: "ID", name: id, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use minúsculas e hífens."] }
              - { label: "Nome em português", name: nome_pt, widget: string }
              - { label: "Name in English", name: nome_en, widget: string }
              - { label: "Orientação em português", name: descricao_pt, widget: text, required: false }
              - { label: "Guidance in English", name: descricao_en, widget: text, required: false }
              - label: "Arquivos"
                label_singular: "Arquivo"
                name: documentos
                widget: list
                collapsed: true
                summary: "{{fields.nome_pt}} — {{fields.data}}"
                hint: "Adicione um PDF ou, alternativamente, um link externo. Confira a data antes de enviar."
                fields:
                  - { label: "Nome em português", name: nome_pt, widget: string }
                  - { label: "Name in English", name: nome_en, widget: string, required: false }
                  - { label: "Descrição em português", name: descricao_pt, widget: text, required: false }
                  - { label: "Description in English", name: descricao_en, widget: text, required: false }
                  - label: "PDF ou arquivo"
                    name: arquivo
                    widget: file
                    required: false
                    choose_url: false
                    media_folder: /static/documents
                    public_folder: /documents
                    allow_multiple: false
                    hint: "Use preferencialmente PDF, com nome simples e no máximo 10 MB."
                    media_library:
                      config:
                        multiple: false
                        max_file_size: 10485760
                  - { label: "Link externo (alternativa ao arquivo)", name: link_externo, widget: string, required: false }
                  - label: "Data de referência"
                    name: data
                    widget: datetime
                    date_format: "DD/MM/YYYY"
                    time_format: false
                    format: "YYYY-MM-DD"

  - name: biblioteca
    label: "7. Correspondências da Biblioteca"
    description: "Área avançada: associe uma variação de nome encontrada na Biblioteca à pessoa correta."
    format: json
    files:
      - label: "Aliases de orientadores"
        name: aliases
        file: data/pessoal/aliases_biblioteca.json
        fields:
          - { label: "Versão", name: schema_version, widget: hidden, default: 1 }
          - label: "Correspondências"
            label_singular: "Correspondência"
            name: aliases
            widget: list
            collapsed: true
            summary: "{{fields.nome_fonte}} → {{fields.professor_id}}"
            fields:
              - { label: "Nome como aparece na Biblioteca", name: nome_fonte, widget: string }
              - label: "Pessoa correta"
                name: professor_id
                widget: relation
                collection: pessoal
                file: professores
                search_fields: ["professores.*.nome", "professores.*.id"]
                display_fields: ["professores.*.nome", "professores.*.id"]
                value_field: "professores.*.id"
              - { label: "Observação", name: observacao, widget: string, required: false }
              - { label: "Data da conferência", name: verificado_em, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
