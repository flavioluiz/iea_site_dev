linhas:
  aerodinamica:
    id: "aerodinamica"
    nome_pt: "Aerodinâmica e Mecânica dos Fluidos"
    nome_en: "Aerodynamics and Fluid Mechanics"
    tema: "aeronautica"
    departamento: "iea-a"
    descricao_pt: "Aerodinâmica computacional e experimental, mecânica dos fluidos, escoamentos turbulentos, métodos de Lattice-Boltzmann, DNS e LES."
    descricao_en: "Computational and experimental aerodynamics, fluid mechanics, turbulent flows, Lattice-Boltzmann methods, DNS and LES."
    cor: "#1e40af"
    icon: "wind"

  aeroelasticidade:
    id: "aeroelasticidade"
    nome_pt: "Aeroelasticidade e Aeroacústica"
    nome_en: "Aeroelasticity and Aeroacoustics"
    tema: "aeronautica"
    departamento: "iea-a"
    descricao_pt: "Aeroelasticidade estática e dinâmica, flutter, buffeting, acústica aeronáutica e redução de ruído."
    descricao_en: "Static and dynamic aeroelasticity, flutter, buffeting, aeronautical acoustics, and noise reduction."
    cor: "#1d4ed8"
    icon: "volume-up"

  mecanica_voo:
    id: "mecanica_voo"
    nome_pt: "Mecânica e Controle de Voo"
    nome_en: "Flight Mechanics and Control"
    tema: "aeronautica"
    departamento: "iea-b"
    descricao_pt: "Dinâmica de voo, controle de aeronaves, estabilidade e controle, sistemas fly-by-wire, UAVs."
    descricao_en: "Flight dynamics, aircraft control, stability and control, fly-by-wire systems, UAVs."
    cor: "#7c3aed"
    icon: "adjustments"

  propulsao_aeronautica:
    id: "propulsao_aeronautica"
    nome_pt: "Propulsão Aeronáutica"
    nome_en: "Aeronautical Propulsion"
    tema: "aeronautica"
    departamento: "iea-c"
    descricao_pt: "Turbinas a gás, turbofans, turboprops, combustão em turbinas, eficiência energética e emissões."
    descricao_en: "Gas turbines, turbofans, turboprops, turbine combustion, energy efficiency, and emissions."
    cor: "#dc2626"
    icon: "fire"

  propulsao_espacial:
    id: "propulsao_espacial"
    nome_pt: "Propulsão Espacial"
    nome_en: "Space Propulsion"
    tema: "espacial"
    departamento: "iea-c"
    descricao_pt: "Propulsão a propelente sólido e líquido, propulsão elétrica (Hall, íon), micropropulsão para CubeSats, motor-foguete."
    descricao_en: "Solid and liquid propellant propulsion, electric propulsion (Hall, ion), micropropulsion for CubeSats, rocket motors."
    cor: "#b91c1c"
    icon: "rocket"

  estruturas:
    id: "estruturas"
    nome_pt: "Estruturas Aeronáuticas e Compósitos"
    nome_en: "Aeronautical Structures and Composites"
    tema: "aeronautica"
    departamento: "iea-e"
    descricao_pt: "Projeto e análise estrutural, materiais compósitos, elementos finitos, ensaios experimentais, otimização estrutural."
    descricao_en: "Structural design and analysis, composite materials, finite elements, experimental testing, structural optimization."
    cor: "#16a34a"
    icon: "cube"

  reentrada:
    id: "reentrada"
    nome_pt: "Reentrada Atmosférica e Termodinâmica de Alta Temperatura"
    nome_en: "Atmospheric Reentry and High-Temperature Thermodynamics"
    tema: "espacial"
    departamento: "iea-e"
    descricao_pt: "Escudos térmicos, plasma de alta temperatura, escoamento hipersônico, ablação, balística de reentrada."
    descricao_en: "Thermal shields, high-temperature plasma, hypersonic flow, ablation, reentry ballistics."
    cor: "#c2410c"
    icon: "fire"

  projetos_aeroespaciais:
    id: "projetos_aeroespaciais"
    nome_pt: "Projetos Integrados de Aeronaves e Espaçonaves"
    nome_en: "Integrated Aeronautical and Spacecraft Projects"
    tema: "aeronautica"
    departamento: "iea-p"
    descricao_pt: "Projeto conceitual e preliminar de aeronaves, otimização multidisciplinar (MDO), novos conceitos de aeronaves, mobilidade aérea avançada."
    descricao_en: "Conceptual and preliminary aircraft design, multidisciplinary design optimization (MDO), new aircraft concepts, advanced air mobility."
    cor: "#0891b2"
    icon: "pencil"

  satelites:
    id: "satelites"
    nome_pt: "Satélites e Sistemas Espaciais"
    nome_en: "Satellites and Space Systems"
    tema: "espacial"
    departamento: "iea-s"
    descricao_pt: "Projeto de satélites, CubeSats, subsistemas espaciais (EPS, ADCS, OBC, TT&C), missões orbitais, operação de satélites."
    descricao_en: "Satellite design, CubeSats, space subsystems (EPS, ADCS, OBC, TT&C), orbital missions, satellite operations."
    cor: "#4f46e5"
    icon: "satellite"

  gnc:
    id: "gnc"
    nome_pt: "Guiagem, Navegação e Controle (GNC)"
    nome_en: "Guidance, Navigation and Control (GNC)"
    tema: "espacial"
    departamento: "iea-s"
    descricao_pt: "Controle de atitude e órbita, navegação inercial, sensores espaciais (star trackers, sun sensors, magnetômetros), algoritmos de controle para espaçonaves."
    descricao_en: "Attitude and orbit control, inertial navigation, space sensors (star trackers, sun sensors, magnetometers), spacecraft control algorithms."
    cor: "#6d28d9"
    icon: "location-marker"

  lancadores:
    id: "lancadores"
    nome_pt: "Veículos Lançadores"
    nome_en: "Launch Vehicles"
    tema: "espacial"
    departamento: "iea-c"
    descricao_pt: "Aerodinâmica de foguetes, estruturas de lançadores, separação de estágios, balística exterior, veículos de sondagem."
    descricao_en: "Rocket aerodynamics, launcher structures, stage separation, exterior ballistics, sounding vehicles."
    cor: "#991b1b"
    icon: "arrow-up"

  materiais:
    id: "materiais"
    nome_pt: "Materiais Aeroespaciais e Manufatura"
    nome_en: "Aerospace Materials and Manufacturing"
    tema: "aeronautica"
    departamento: "iea-e"
    descricao_pt: "Materiais compósitos, ligas leves, cerâmicas, processos de fabricação aeroespacial, manufatura aditiva, caracterização."
    descricao_en: "Composite materials, light alloys, ceramics, aerospace manufacturing processes, additive manufacturing, characterization."
    cor: "#d97706"
    icon: "beaker"
