name: Update Library data

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Coletar e validar sem abrir pull request"
        type: boolean
        default: true
      type:
        description: "Conjunto a atualizar"
        type: choice
        options: [all, teses, tgs]
        default: all

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-library
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIBRARY_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPDATE_TYPE: ${{ inputs.type || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The fetch/parse stages run without a credential persisted in Git config.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-cms.txt
            scripts/requirements-library.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-cms.txt -r scripts/requirements-library.txt
      - run: python -m unittest discover -s scripts/library/tests -v
      - name: Fetch into disposable staging
        run: python scripts/library/fetch.py --output "${RUNNER_TEMP}/library-raw" --type "${UPDATE_TYPE}"
      - name: Normalize and enforce last-good thresholds
        run: >-
          python scripts/library/normalize.py
          --input "${RUNNER_TEMP}/library-raw"
          --output "${RUNNER_TEMP}/library-generated"
          --previous data/generated/biblioteca
          --report "${RUNNER_TEMP}/library-report.md"
      - name: Preserve report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-report
          path: ${{ runner.temp }}/library-report.md
          retention-days: 30
      - name: Stop after safe dry run
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: cat "${RUNNER_TEMP}/library-report.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Promote staging and validate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          rsync --archive --delete "${RUNNER_TEMP}/library-generated/" data/generated/biblioteca/
          python scripts/validate_data.py
          cat "${RUNNER_TEMP}/library-report.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Open auditable pull request
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/generated/biblioteca; then
            echo "Nenhuma mudança substantiva."
            exit 0
          fi
          branch="bot/biblioteca-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          gh auth setup-git
          git config user.name "iea-library-bot"
          git config user.email "iea-library-bot@users.noreply.github.com"
          git checkout -b "${branch}"
          git add data/generated/biblioteca
          git commit -m "data: atualizar metadados da Biblioteca"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" --title "data: atualização da Biblioteca" --body-file "${RUNNER_TEMP}/library-report.md"
          gh workflow run ci.yml --ref "${branch}"
      - name: Close a previous operational alert after recovery
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          issue="$(gh issue list --repo "${REPOSITORY}" --state open --search 'Pipeline Biblioteca in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue close "${issue}" --repo "${REPOSITORY}" --comment "Pipeline executado com sucesso; a última versão boa permaneceu protegida."
          fi

  alert:
    needs: update
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Open or update one operational alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue="$(gh issue list --repo "${REPOSITORY}" --state open --search 'Pipeline Biblioteca in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --repo "${REPOSITORY}" --body "Nova falha preservou a última versão boa: ${RUN_URL}"
          else
            gh issue create --repo "${REPOSITORY}" --title "Operação: falha no Pipeline Biblioteca" --body "A coleta falhou e nenhum dado publicado foi substituído. Execução: ${RUN_URL}"
          fi
