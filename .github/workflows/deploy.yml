name: Deploy pilot site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: github-pages-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: bash scripts/ci/install_hugo.sh
      - name: Build production tree
        run: hugo --gc --minify --printPathWarnings --environment production --config config/_default/config.yaml,config/production/config.yaml
      - name: Publish only after successful CI
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PAGES_TARGET_REPOSITORY: flavioluiz/iea_site
        run: bash scripts/ci/publish_pages_tree.sh public . "Deploy ${{ github.event.workflow_run.head_sha }}"
