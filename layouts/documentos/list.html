{{ define "main" }}
<div class="max-w-5xl mx-auto px-4 py-8">
  <div class="mb-10">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">{{ .Title }}</h1>
    <div class="prose prose-lg text-gray-700">{{ .Content }}</div>
  </div>
  {{ range .Site.Data.documentos.categorias }}
    {{ partial "document-category.html" (dict "category" . "page" $) }}
  {{ end }}
</div>
{{ end }}
